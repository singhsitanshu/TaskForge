name: ${COMPOSE_PROJECT_NAME:-taskforge}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskforge}
      POSTGRES_USER: ${POSTGRES_USER:-taskforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskforge}:${POSTGRES_PASSWORD:-taskforge}@postgres:5432/${POSTGRES_DB:-taskforge}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-5s}
      WORKER_STALE_AFTER: ${WORKER_STALE_AFTER:-15s}
      WORKER_DEAD_AFTER: ${WORKER_DEAD_AFTER:-30s}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  scheduler:
    build:
      context: ./scheduler
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskforge}:${POSTGRES_PASSWORD:-taskforge}@postgres:5432/${POSTGRES_DB:-taskforge}?sslmode=disable
      SCHEDULER_RECOVERY_INTERVAL: ${SCHEDULER_RECOVERY_INTERVAL:-5s}
      SCHEDULER_RECOVERY_BATCH_SIZE: ${SCHEDULER_RECOVERY_BATCH_SIZE:-100}
      SCHEDULER_RECOVERY_DB_TIMEOUT: ${SCHEDULER_RECOVERY_DB_TIMEOUT:-2s}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskforge}:${POSTGRES_PASSWORD:-taskforge}@postgres:5432/${POSTGRES_DB:-taskforge}?sslmode=disable
      POLL_INTERVAL: 1s
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-5s}
      WORKER_STALE_AFTER: ${WORKER_STALE_AFTER:-15s}
      WORKER_DEAD_AFTER: ${WORKER_DEAD_AFTER:-30s}
      WORKER_HEARTBEAT_TIMEOUT: ${WORKER_HEARTBEAT_TIMEOUT:-2s}
      WORKER_TASK_LEASE_DURATION: ${WORKER_TASK_LEASE_DURATION:-30s}
      WORKER_TASK_LEASE_RENEW_INTERVAL: ${WORKER_TASK_LEASE_RENEW_INTERVAL:-10s}
      WORKER_TASK_LEASE_RENEW_TIMEOUT: ${WORKER_TASK_LEASE_RENEW_TIMEOUT:-2s}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  integration-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-taskforge}:${POSTGRES_PASSWORD:-taskforge}@postgres:5432/${POSTGRES_DB:-taskforge}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]

  claim-tests:
    build:
      context: .
      dockerfile: tests/claim.Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-taskforge}:${POSTGRES_PASSWORD:-taskforge}@postgres:5432/${POSTGRES_DB:-taskforge}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]

  recovery-tests:
    build:
      context: .
      dockerfile: tests/recovery.Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-taskforge}:${POSTGRES_PASSWORD:-taskforge}@postgres:5432/${POSTGRES_DB:-taskforge}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]

volumes:
  postgres-data:
  redis-data:
